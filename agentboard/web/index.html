<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgentBoard</title>
  <link rel="stylesheet" href="styles.css">
  <script>
    try { const t = localStorage.getItem("ab.theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="titlebar pywebview-drag-region" id="titlebar">
    <div class="wordmark pywebview-drag-region">AgentBoard<span class="live" id="live" title="Live"></span></div>
    <button class="iconbtn" id="btn-theme" title="Switch light or dark" aria-label="Switch light or dark" data-icon="moon"></button>
    <button class="iconbtn" id="btn-pin" title="Keep on top" aria-label="Keep on top" aria-pressed="true" data-icon="push-pin"></button>
    <button class="iconbtn" id="btn-settings" title="Settings file" aria-label="Open settings file" data-icon="gear-six"></button>
    <span class="sep" aria-hidden="true"></span>
    <button class="iconbtn" id="btn-min" title="Minimise" aria-label="Minimise" data-icon="minus"></button>
    <button class="iconbtn" id="btn-max" title="Maximise" aria-label="Maximise" aria-pressed="false" data-icon="corners-out"></button>
    <button class="iconbtn close" id="btn-close" title="Close" aria-label="Close" data-icon="x"></button>
  </header>

  <div class="toolbar pywebview-drag-region" id="toolbar">
    <div class="segmented" role="tablist" aria-label="Pages">
      <button role="tab" id="tab-usage" aria-controls="page-usage" aria-selected="true" data-page="usage"><span class="icon" data-icon="chart-donut"></span>Usage</button>
      <button role="tab" id="tab-agents" aria-controls="page-agents" aria-selected="false" data-page="agents"><span class="icon" data-icon="stack"></span>Agents<span class="count mono" id="agent-count">0</span></button>
    </div>
    <section class="totals" aria-label="Today">
      <div><b class="mono" id="t-today">0</b><span>tokens today</span></div>
      <div><b class="mono" id="t-agents">0</b><span>running</span></div>
      <div><b class="mono" id="t-working">0</b><span>working</span></div>
      <button id="t-waiting-wrap"><b class="mono" id="t-waiting">0</b><span>need you</span></button>
    </section>
    <div class="layout" id="layout" role="group" aria-label="Columns">
      <button class="lbtn" data-cols="3" title="3 columns" aria-label="3 columns" aria-pressed="false" data-icon="kanban"></button>
      <button class="lbtn" data-cols="2" title="2 columns" aria-label="2 columns" aria-pressed="false" data-icon="columns"></button>
      <button class="lbtn" data-cols="1" title="1 column" aria-label="1 column" aria-pressed="false" data-icon="rows"></button>
    </div>
    <button class="addbtn" id="btn-add" title="Add monitor" aria-label="Add monitor" aria-expanded="false" aria-controls="add-panel" data-icon="plus"></button>
  </div>

  <div class="banner" id="banner" role="alert" hidden><span class="icon" data-icon="warning-circle"></span><span id="banner-text"></span></div>

  <main id="main">
    <section class="page" id="page-usage" role="tabpanel" aria-labelledby="tab-usage">
      <div class="cards" id="cards"></div>
    </section>
    <section class="page" id="page-agents" role="tabpanel" aria-labelledby="tab-agents" hidden>
      <div class="types" id="types" role="toolbar" aria-label="Agent types"></div>
      <div class="pinned" id="pinned" hidden>
        <div class="pinned-head"><span class="icon" data-icon="push-pin"></span>Pinned</div>
        <div class="pinned-grid" id="pinned-grid"></div>
      </div>
      <div class="detail" id="detail" hidden></div>
    </section>
  </main>

  <div class="pop" id="add-panel" role="dialog" aria-label="Add a monitor" hidden>
    <div class="add-head">Add a monitor<button class="iconbtn" id="add-close" title="Close" aria-label="Close" data-icon="x"></button></div>
    <div class="add-list" id="add-list" role="list"></div>
  </div>
  <div class="pop plan-pop" id="plan-panel" role="dialog" aria-labelledby="plan-title" hidden>
    <div class="add-head"><span id="plan-title">Plan</span><button class="iconbtn" id="plan-close" title="Close" aria-label="Close" data-icon="x"></button></div>
    <div class="plan-list" id="plan-list" role="radiogroup" aria-labelledby="plan-title"></div>
    <div class="plan-custom" id="plan-custom" hidden></div>
    <p class="plan-note" id="plan-note"></p>
  </div>
  <div class="ctx" id="ctx" role="menu" aria-label="Session" hidden>
    <button class="ctx-item" id="ctx-pin" role="menuitem"><span class="icon" data-icon="push-pin"></span><span id="ctx-pin-label">Pin to top</span></button>
    <div class="ctx-label">Highlight</div>
    <div class="ctx-sw" id="ctx-sw" role="group" aria-label="Highlight colour"></div>
    <div class="ctx-sep"></div>
    <button class="ctx-item" id="ctx-open" role="menuitem"><span class="icon" data-icon="arrow-up-right"></span><span>Open</span></button>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"><span class="icon" id="toast-icon"></span><span id="toast-text"></span></div>

  <script src="vendor/icons.js"></script>
  <script src="app.js"></script>
</body>
</html>
